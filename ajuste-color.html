<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ajuste de color — vídeo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#101312;color:#f0f2ee;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:2rem}
header{position:sticky;top:0;z-index:5;background:#101312;padding:.7rem .9rem .4rem;border-bottom:1px solid #2a312c}
header h1{font-size:1rem;font-weight:600}
header p{font-size:.78rem;color:#9aa39c;margin-top:.15rem}
.marco{margin:.8rem .9rem 0;border-radius:12px;overflow:hidden;background:#000}
.marco canvas{display:block;width:100%;height:auto}
.panel{padding:1rem .9rem 0;display:grid;gap:1.1rem;max-width:560px;margin:0 auto}
.ctl{background:#1a1f1c;border-radius:12px;padding:.9rem 1rem}
.ctl .fila{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.55rem}
.ctl label{font-size:.92rem;font-weight:600}
.ctl small{display:block;font-size:.72rem;color:#7d857e;font-weight:400;margin-top:.1rem}
.ctl output{font-size:.92rem;color:#d9f45b;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:44px;-webkit-appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#333b36}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#d9f45b;margin-top:-11px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#333b36}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:none;border-radius:50%;background:#d9f45b}
.presets{display:flex;gap:.6rem;flex-wrap:wrap}
.presets button{flex:1;min-width:7rem;padding:.8rem .5rem;border-radius:10px;border:1px solid #333b36;background:#1a1f1c;color:#f0f2ee;font-size:.85rem;font-weight:600}
#copiar{display:block;width:calc(100% - 1.8rem);max-width:560px;margin:1.2rem auto 0;padding:1.05rem;border:none;border-radius:999px;background:#d9f45b;color:#17211c;font-size:1.05rem;font-weight:700}
#aviso{text-align:center;font-size:.85rem;color:#9aa39c;margin-top:.7rem;min-height:1.4em}
#aviso.ok{color:#d9f45b}
.nota{font-size:.75rem;color:#7d857e;text-align:center;margin-top:1rem;padding:0 1.2rem;line-height:1.5}
</style>
</head>
<body>
<header>
  <h1>Ajuste de color del vídeo</h1>
  <p>Mueve los deslizadores hasta que te guste, luego pulsa copiar y pégame los números.</p>
</header>

<div class="marco"><canvas id="vista" width="480" height="270"></canvas></div>

<div class="panel">
  <div class="ctl">
    <div class="fila"><label for="s-temp">Temperatura<small>subir enfría · bajar calienta</small></label><output id="o-temp"></output></div>
    <input type="range" id="s-temp" min="4500" max="8000" step="100" value="7000">
  </div>
  <div class="ctl">
    <div class="fila"><label for="s-mag">Tono magenta</label><output id="o-mag"></output></div>
    <input type="range" id="s-mag" min="-0.30" max="0" step="0.01" value="-0.20">
  </div>
  <div class="ctl">
    <div class="fila"><label for="s-azu">Azul (mata amarillo)</label><output id="o-azu"></output></div>
    <input type="range" id="s-azu" min="-0.10" max="0.20" step="0.01" value="0.03">
  </div>
  <div class="ctl">
    <div class="fila"><label for="s-sat">Saturación</label><output id="o-sat"></output></div>
    <input type="range" id="s-sat" min="0.80" max="2" step="0.05" value="1.65">
  </div>
  <div class="presets">
    <button type="button" data-p="7000,-0.20,0.03,1.65">Tu receta</button>
    <button type="button" data-p="6600,-0.21,0,1.40">Actual</button>
    <button type="button" data-p="6500,0,0,1">Cero</button>
  </div>
</div>

<button id="copiar" type="button">Copiar parámetros</button>
<p id="aviso"></p>
<p class="nota">Vista previa calculada píxel a píxel con el mismo proceso que el vídeo final. El vídeo definitivo lo genero yo con los números que me pegues.</p>

function fmt(n,d){const s=Number(n).toFixed(d);return (n>0?'+':'')+(s==='-0.00'?'0.00':s).replace('+0.00','0.00');}

function aplicar(){
  const T=+S.temp.value, gm=+S.mag.value, bm=+S.azu.value, st=+S.sat.value;
  $('o-temp').textContent=T;
  $('o-mag').textContent=fmt(gm,2);
  $('o-azu').textContent=fmt(bm,2);
  $('o-sat').textContent=st.toFixed(2);
  if(!base)return {T,gm,bm,st};
  const t=(T-6500)/1000;
  const rG=1-0.04*t, gG=(1-0.01*t)*(1+gm), bG=(1+0.09*t)*(1+bm);
  const out=ctx.createImageData(W,H), d=out.data, s=base.data;
  for(let i=0;i<d.length;i+=4){
    let r=s[i]*rG, g=s[i+1]*gG, b=s[i+2]*bG;
    const gr=0.299*r+0.587*g+0.114*b;
    r=gr+st*(r-gr); g=gr+st*(g-gr); b=gr+st*(b-gr);
    d[i]=r<0?0:r>255?255:r;
    d[i+1]=g<0?0:g>255?255:g;
    d[i+2]=b<0?0:b>255?255:b;
    d[i+3]=255;
  }
  ctx.putImageData(out,0,0);
  return {T,gm,bm,st};
}
Object.values(S).forEach(s=>s.addEventListener('input',aplicar));

document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
  const [t,m,a,s]=b.dataset.p.split(',').map(Number);
  S.temp.value=t;S.mag.value=m;S.azu.value=a;S.sat.value=s;aplicar();
}));

$('copiar').addEventListener('click',async()=>{
  const {T,gm,bm,st}=aplicar();
  const txt=`colortemperature=temperature=${T},colorbalance=gm=${gm.toFixed(2)}:bm=${bm>=0?'+':''}${bm.toFixed(2)},eq=saturation=${st.toFixed(2)}`;
  try{await navigator.clipboard.writeText(txt);}
  catch(e){
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
    document.execCommand('copy');ta.remove();
  }
  aviso.textContent='¡Copiado! Pégamelo en el chat.';aviso.classList.add('ok');
  setTimeout(()=>{aviso.textContent='';aviso.classList.remove('ok');},3500);
});
</script>
